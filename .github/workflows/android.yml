name: Android APK Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Download Vosk English Model
        run: |
          mkdir -p app/src/main/assets/model
          curl -L --fail --retry 3 \
            https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip \
            -o /tmp/vosk-model.zip
          unzip -q /tmp/vosk-model.zip -d /tmp/vosk-model
          cp -a /tmp/vosk-model/vosk-model-small-en-us-0.15/. app/src/main/assets/model/
                    cat /proc/sys/kernel/random/uuid > app/src/main/assets/model/uuid

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceAssistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk
